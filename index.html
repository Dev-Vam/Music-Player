<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Music Player ♪</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Press Start 2P', cursive;
            background: linear-gradient(135deg, #ffd6e8 0%, #c4b5fd 50%, #bfdbfe 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 0;
            margin: 0;
            overflow-x: hidden;
        }
        
        .titlebar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(135deg, #ff69b4, #ff1493);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            -webkit-app-region: drag;
            z-index: 1000;
            border-bottom: 3px solid #c41e3a;
        }
        
        @media (max-width: 768px) {
            .titlebar {
                height: 50px;
                padding: 0 10px;
            }
        }
        
        .titlebar-title {
            color: white;
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        @media (max-width: 768px) {
            .titlebar-title {
                font-size: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .titlebar-title {
                font-size: 6px;
            }
        }
        
        .titlebar-controls {
            display: flex;
            gap: 8px;
            -webkit-app-region: no-drag;
        }
        
        .titlebar-button {
            width: 30px;
            height: 30px;
            border: 2px solid white;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Press Start 2P', cursive;
        }
        
        .titlebar-button:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.1);
        }
        
        .titlebar-button.close:hover {
            background: #ff3333;
        }
        
        @media (max-width: 768px) {
            .titlebar-button {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }
        }
        
        .app-content {
            margin-top: 40px;
            padding: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .app-content {
                margin-top: 50px;
                padding: 10px;
            }
        }
        
        .container {
            background: #fff;
            border: 4px solid #ff69b4;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 8px 8px 0 rgba(255, 105, 180, 0.3);
            position: relative;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                border-radius: 15px;
                border-width: 3px;
                box-shadow: 5px 5px 0 rgba(255, 105, 180, 0.3);
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
                border-radius: 10px;
            }
        }
        
        .container::before {
            content: '♪';
            position: absolute;
            top: -15px;
            left: 20px;
            background: #ff69b4;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 16px;
            box-shadow: 4px 4px 0 rgba(255, 105, 180, 0.3);
        }
        
        h1 {
            color: #ff69b4;
            text-align: center;
            font-size: 18px;
            margin-bottom: 30px;
            text-shadow: 3px 3px 0 #ffc0cb;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 14px;
                margin-bottom: 20px;
            }
        }
        
        @media (max-width: 480px) {
            h1 {
                font-size: 12px;
                margin-bottom: 15px;
            }
        }
        
        .player {
            background: linear-gradient(135deg, #ffd6e8 0%, #ffc0cb 100%);
            border: 3px solid #ff69b4;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .display {
            background: #1a1a2e;
            border: 3px solid #ff69b4;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .song-info {
            color: #00ff00;
            font-size: 10px;
            text-align: center;
            line-height: 1.8;
        }
        
        @media (max-width: 768px) {
            .song-info {
                font-size: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .song-info {
                font-size: 7px;
                line-height: 1.6;
            }
        }
        
        .visualizer {
            display: flex;
            justify-content: center;
            gap: 4px;
            margin-bottom: 20px;
            height: 60px;
            align-items: flex-end;
        }
        
        .bar {
            width: 12px;
            background: linear-gradient(to top, #ff69b4, #ffc0cb);
            border-radius: 4px 4px 0 0;
            transition: height 0.1s ease;
        }
        
        .progress-container {
            background: #1a1a2e;
            border: 2px solid #ff69b4;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        
        .progress-bar {
            height: 20px;
            background: linear-gradient(90deg, #ff69b4, #ffc0cb);
            border-radius: 5px;
            width: 0%;
            transition: width 0.1s linear;
            position: relative;
        }
        
        .progress-bar::after {
            content: '♥';
            position: absolute;
            right: -5px;
            top: 50%;
            transform: translateY(-50%);
            color: #ff1493;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 480px) {
            .controls {
                gap: 10px;
            }
        }
        
        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 12px;
            padding: 15px 20px;
            border: 3px solid #ff69b4;
            border-radius: 10px;
            background: white;
            color: #ff69b4;
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 4px 4px 0 rgba(255, 105, 180, 0.3);
        }
        
        @media (max-width: 768px) {
            button {
                font-size: 10px;
                padding: 12px 16px;
            }
        }
        
        @media (max-width: 480px) {
            button {
                font-size: 9px;
                padding: 10px 12px;
                border-width: 2px;
            }
        }
        
        button:hover {
            background: #ff69b4;
            color: white;
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 rgba(255, 105, 180, 0.3);
        }
        
        button:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }
        
        .playlist {
            max-height: 200px;
            overflow-y: auto;
            border: 3px solid #ff69b4;
            border-radius: 10px;
            background: #fff9fc;
        }
        
        .playlist-item {
            padding: 12px;
            border-bottom: 2px solid #ffc0cb;
            cursor: pointer;
            font-size: 9px;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        @media (max-width: 768px) {
            .playlist-item {
                font-size: 8px;
                padding: 10px;
            }
        }
        
        @media (max-width: 480px) {
            .playlist-item {
                font-size: 7px;
                padding: 8px;
                gap: 6px;
            }
        }
        
        .playlist-item:hover {
            background: #ffe4f0;
        }
        
        .playlist-item.active {
            background: #ffd6e8;
            color: #ff1493;
        }
        
        .playlist-item::before {
            content: '♪';
            color: #ff69b4;
            font-size: 12px;
        }
        
        .upload-area {
            border: 3px dashed #ff69b4;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s;
            background: #fff9fc;
        }
        
        .upload-area:hover, .upload-area.drag-over {
            background: #ffe4f0;
            border-style: solid;
            transform: scale(1.02);
        }
        
        .upload-area.drag-over {
            background: #ffd6e8;
            border-color: #ff1493;
        }
        
        .upload-area label {
            cursor: pointer;
            font-size: 10px;
            color: #ff69b4;
        }
        
        @media (max-width: 768px) {
            .upload-area label {
                font-size: 8px;
            }
        }
        
        @media (max-width: 480px) {
            .upload-area {
                padding: 15px;
            }
            
            .upload-area label {
                font-size: 7px;
            }
        }
        
        input[type="file"] {
            display: none;
        }
        
        .emoji-decoration {
            text-align: center;
            font-size: 20px;
            margin: 15px 0;
        }
        
        @media (max-width: 480px) {
            .emoji-decoration {
                font-size: 16px;
                margin: 10px 0;
            }
        }
        
        ::-webkit-scrollbar {
            width: 10px;
        }
        
        ::-webkit-scrollbar-track {
            background: #ffc0cb;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #ff69b4;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="titlebar">
        <div class="titlebar-title">
            ♪ KAWAII MUSIC PLAYER ♪
        </div>
        <div class="titlebar-controls">
            <div class="titlebar-button minimize" id="minimizeBtn">-</div>
            <div class="titlebar-button maximize" id="maximizeBtn">□</div>
            <div class="titlebar-button close" id="closeBtn">×</div>
        </div>
    </div>
    
    <div class="app-content">
    <div class="container">
        <h1>♥ MUSIC ♥</h1>
        
        <div class="player">
            <div class="display">
                <div class="song-info" id="songInfo">
                    NO SONG LOADED<br>
                    ADD MUSIC BELOW ♥
                </div>
            </div>
            
            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            
            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <div class="controls">
                <button id="prevBtn">⏮</button>
                <button id="playBtn">▶</button>
                <button id="nextBtn">⏭</button>
            </div>
        </div>
        
        <div class="emoji-decoration">🎀 ✨ 🌸 ✨ 🎀</div>
        
        <div class="upload-area" id="uploadArea">
            <label for="fileInput">
                ✨ CLICK OR DRAG FILES HERE ✨<br>
                (MP3, WAV, OGG, MP4, M4A)
            </label>
            <input type="file" id="fileInput" accept="audio/*,video/mp4,video/*,.mp4,.m4a" multiple>
        </div>
        
        <div style="margin-bottom: 15px; display: flex; gap: 10px; justify-content: center;">
            <button id="savePlaylistBtn" style="font-size: 9px; padding: 10px 15px;">SAVE</button>
            <button id="loadPlaylistBtn" style="font-size: 9px; padding: 10px 15px;">LOAD</button>
            <button id="clearPlaylistBtn" style="font-size: 9px; padding: 10px 15px;">CLEAR</button>
        </div>
        
        <div class="playlist" id="playlist"></div>
        <input type="file" id="playlistFileInput" accept=".json" style="display: none;">
    </div>
    </div>
    
    <audio id="audio"></audio>
    
    <script>
        const audio = document.getElementById('audio');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const songInfo = document.getElementById('songInfo');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const fileInput = document.getElementById('fileInput');
        const playlist = document.getElementById('playlist');
        const visualizer = document.getElementById('visualizer');
        const savePlaylistBtn = document.getElementById('savePlaylistBtn');
        const loadPlaylistBtn = document.getElementById('loadPlaylistBtn');
        const clearPlaylistBtn = document.getElementById('clearPlaylistBtn');
        const playlistFileInput = document.getElementById('playlistFileInput');
        const uploadArea = document.getElementById('uploadArea');
        
        let songs = [];
        let currentSongIndex = -1;
        let isPlaying = false;
        
        // Load saved playlist on startup
        const savedPlaylist = localStorage.getItem('kawaii-playlist');
        if (savedPlaylist) {
            try {
                songs = JSON.parse(savedPlaylist);
                renderPlaylist();
                if (songs.length > 0) {
                    loadSong(0);
                }
            } catch (e) {
                console.error('Failed to load playlist:', e);
            }
        }
        
        // Visualizer animation
        function animateVisualizer() {
            const bars = visualizer.querySelectorAll('.bar');
            bars.forEach(bar => {
                const height = isPlaying ? Math.random() * 60 : 10;
                bar.style.height = height + 'px';
            });
        }
        
        setInterval(animateVisualizer, 150);
        
        // Helper function to add files
        function addFiles(files) {
            Array.from(files).forEach(file => {
                // Accept audio files and video files (including MP4)
                if (file.type.startsWith('audio/') || 
                    file.type.startsWith('video/') || 
                    file.name.toLowerCase().endsWith('.mp4') ||
                    file.name.toLowerCase().endsWith('.m4a')) {
                    songs.push({
                        name: file.name.replace(/\.[^/.]+$/, ''),
                        url: URL.createObjectURL(file),
                        type: file.type || 'video/mp4'
                    });
                }
            });
            savePlaylistToStorage();
            renderPlaylist();
            if (currentSongIndex === -1 && songs.length > 0) {
                loadSong(0);
            }
        }
        
        // File upload via click
        fileInput.addEventListener('change', (e) => {
            addFiles(e.target.files);
        });
        
        // Drag and drop functionality
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.add('drag-over');
        });
        
        uploadArea.addEventListener('dragleave', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            uploadArea.classList.remove('drag-over');
            
            const files = e.dataTransfer.files;
            addFiles(files);
        });
        
        // Also allow drag and drop on the entire window
        document.addEventListener('dragover', (e) => {
            e.preventDefault();
        });
        
        document.addEventListener('drop', (e) => {
            e.preventDefault();
        });
        
        // Save playlist to localStorage
        function savePlaylistToStorage() {
            localStorage.setItem('kawaii-playlist', JSON.stringify(songs));
        }
        
        // Save playlist to file
        savePlaylistBtn.addEventListener('click', () => {
            if (songs.length === 0) {
                alert('No songs to save!');
                return;
            }
            
            const dataStr = JSON.stringify(songs, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'kawaii-playlist.json';
            link.click();
            URL.revokeObjectURL(url);
        });
        
        // Load playlist from file
        loadPlaylistBtn.addEventListener('click', () => {
            playlistFileInput.click();
        });
        
        playlistFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const loadedSongs = JSON.parse(event.target.result);
                    songs = loadedSongs;
                    savePlaylistToStorage();
                    renderPlaylist();
                    if (songs.length > 0) {
                        loadSong(0);
                    }
                } catch (error) {
                    alert('Invalid playlist file!');
                }
            };
            reader.readAsText(file);
        });
        
        // Clear playlist
        clearPlaylistBtn.addEventListener('click', () => {
            if (confirm('Clear all songs from playlist?')) {
                songs = [];
                currentSongIndex = -1;
                isPlaying = false;
                audio.pause();
                audio.src = '';
                playBtn.textContent = '▶';
                songInfo.innerHTML = 'NO SONG LOADED<br>ADD MUSIC BELOW ♥';
                savePlaylistToStorage();
                renderPlaylist();
            }
        });
        
        // Render playlist
        function renderPlaylist() {
            playlist.innerHTML = '';
            songs.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                if (index === currentSongIndex) {
                    item.classList.add('active');
                }
                item.textContent = song.name;
                item.addEventListener('click', () => loadSong(index));
                playlist.appendChild(item);
            });
        }
        
        // Load song
        function loadSong(index) {
            if (index < 0 || index >= songs.length) return;
            
            currentSongIndex = index;
            const song = songs[index];
            
            // Set the audio source
            audio.src = song.url;
            
            // For video files, ensure they load properly
            if (song.type && song.type.startsWith('video/')) {
                audio.load();
            }
            
            songInfo.innerHTML = `NOW PLAYING:<br>${song.name}`;
            renderPlaylist();
            
            if (isPlaying) {
                audio.play().catch(err => {
                    console.error('Playback error:', err);
                    songInfo.innerHTML = `ERROR PLAYING:<br>${song.name}`;
                });
            }
        }
        
        // Play/Pause
        playBtn.addEventListener('click', () => {
            if (songs.length === 0) return;
            
            if (currentSongIndex === -1) {
                loadSong(0);
            }
            
            if (isPlaying) {
                audio.pause();
                playBtn.textContent = '▶';
                isPlaying = false;
            } else {
                audio.play();
                playBtn.textContent = '⏸';
                isPlaying = true;
            }
        });
        
        // Previous
        prevBtn.addEventListener('click', () => {
            if (songs.length === 0) return;
            const prevIndex = (currentSongIndex - 1 + songs.length) % songs.length;
            loadSong(prevIndex);
            if (isPlaying) audio.play();
        });
        
        // Next
        nextBtn.addEventListener('click', () => {
            if (songs.length === 0) return;
            const nextIndex = (currentSongIndex + 1) % songs.length;
            loadSong(nextIndex);
            if (isPlaying) audio.play();
        });
        
        // Progress bar
        audio.addEventListener('timeupdate', () => {
            if (audio.duration && isFinite(audio.duration)) {
                const progress = (audio.currentTime / audio.duration) * 100;
                progressBar.style.width = progress + '%';
            }
        });
        
        progressContainer.addEventListener('click', (e) => {
            if (audio.duration && isFinite(audio.duration)) {
                const rect = progressContainer.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                audio.currentTime = percent * audio.duration;
            }
        });
        
        // Auto next
        audio.addEventListener('ended', () => {
            const nextIndex = (currentSongIndex + 1) % songs.length;
            loadSong(nextIndex);
            audio.play();
        });
        
        // Title bar controls
        const { ipcRenderer } = window.require ? window.require('electron') : { ipcRenderer: null };
        
        if (ipcRenderer) {
            document.getElementById('minimizeBtn').addEventListener('click', () => {
                ipcRenderer.send('window-minimize');
            });
            
            document.getElementById('maximizeBtn').addEventListener('click', () => {
                ipcRenderer.send('window-maximize');
            });
            
            document.getElementById('closeBtn').addEventListener('click', () => {
                ipcRenderer.send('window-close');
            });
        } else {
            // Fallback for testing in browser
            document.getElementById('minimizeBtn').addEventListener('click', () => {
                console.log('Minimize clicked');
            });
            
            document.getElementById('maximizeBtn').addEventListener('click', () => {
                console.log('Maximize clicked');
            });
            
            document.getElementById('closeBtn').addEventListener('click', () => {
                console.log('Close clicked');
            });
        }
    </script>
</body>
</html>
